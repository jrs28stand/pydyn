[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pydyn"
version = "0.1.0.dev0"
description = "Python front end for Dynare models (Dynare 7.2 preprocessor JSON), with no MATLAB/Octave at run time"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
# numpy 1.x (tested: 1.24, 1.26) fails 8-14 of the tests (last-bit differences in exact replays of Dynare, one
# rejected parameter point accepted); numpy 2.0 + scipy 1.13 pass them all
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/jrs28stand/pydyn"

[tool.setuptools]
packages = ["pydyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
